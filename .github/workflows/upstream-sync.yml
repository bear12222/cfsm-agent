name: Upstream Sync

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huilang-me/cfsm-agent.git || true
          git fetch upstream
          git checkout main
          git merge --ff-only upstream/main || {
            echo "Cannot fast-forward, trying regular merge"
            git merge upstream/main --no-edit -m "chore: sync upstream $(date +%Y-%m-%d)"
          }
          git push origin main
